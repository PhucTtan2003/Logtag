services:
  logtag-api:
    image: logtag-api:v2
    container_name: logtag-api-compose

    restart: unless-stopped

    env_file:
      - .env

    environment:
      ASPNETCORE_URLS: http://+:8080
      WorkerMode: ApiOnly

    ports:
      - "127.0.0.1:8081:8080"

    volumes:
      - logtag_keys:/var/lib/temperature_humi/dataprotection-keys

    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  logtag_keys: